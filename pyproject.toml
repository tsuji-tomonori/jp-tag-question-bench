[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-tag-question-bench"
version = "0.1.0"
description = "Japanese tag-question and sycophancy benchmark for Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
jp-tag-bench-run = "jp_tag_question_bench.runner:main"
jp-tag-bench-analyze = "jp_tag_question_bench.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

